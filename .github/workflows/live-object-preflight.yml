name: Höhn Historical Object Safety Preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  historical-object-safety:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Verify historical/noindex object safety state
        run: node scripts/live-object-preflight.mjs
