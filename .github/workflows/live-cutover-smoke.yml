name: Höhn Live Cutover Smoke

on:
  workflow_dispatch:
  push:
    branches:
      - redesign/coastal-blueprint
    paths:
      - '.github/live-cutover-smoke-trigger'

permissions:
  contents: read

jobs:
  live-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Homepage responds 200
        continue-on-error: true
        shell: bash
        run: test "$(curl --retry 3 --retry-all-errors -LsS -o /tmp/home -w '%{http_code}' https://immo-hoehn.de/)" = 200

      - name: Homepage is new Astro release
        continue-on-error: true
        shell: bash
        run: |
          curl --retry 3 --retry-all-errors -LsS https://immo-hoehn.de/ -o /tmp/home
          grep -Fq 'Immobilien an' /tmp/home
          grep -Fq 'der Ostseeküste' /tmp/home
          grep -Fq 'https://immo-hoehn.de/' /tmp/home
          ! grep -Eiq '<meta[^>]+name=["'"']robots["'"'][^>]+noindex|<meta[^>]+content=["'"'][^"'"']*noindex' /tmp/home

      - name: Core service routes respond 200
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for path in /immobilien/ /immobilie-verkaufen/ /grundstueck-verkaufen/ /immobilienbewertung/ /kontakt/ /impressum/ /datenschutz/; do
            code="$(curl --retry 3 --retry-all-errors -LsS -o /dev/null -w '%{http_code}' "https://immo-hoehn.de$path")"
            echo "$path $code"
            test "$code" = 200
          done

      - name: Obsolete Höhn landline absent on every live page
        shell: bash
        run: |
          set -euo pipefail
          pages=(
            /
            /immobilien/
            /immobilie-verkaufen/
            /grundstueck-verkaufen/
            /immobilienbewertung/
            /kontakt/
            /impressum/
            /datenschutz/
            /ueber-uns/
            /regionen/dassow/
            /regionen/poetenitz/
            /regionen/rosenhagen/
            /regionen/travemuende/
            /regionen/priwall/
            /immobilien/grundstuecke-rosenhagen-623-743/
            /immobilien/baugrundstuecke-rosenhagen-1599-1999/
          )
          for path in "${pages[@]}"; do
            file="/tmp/live-$(printf '%s' "$path" | tr '/-' '__').html"
            curl --retry 3 --retry-all-errors -LsS "https://immo-hoehn.de$path" -o "$file"
            if grep -Eiq '038826([[:space:]]|&nbsp;)*80911|\+49([[:space:]]|&nbsp;)*38826([[:space:]]|&nbsp;)*80911|tel:\+493882680911' "$file"; then
              echo "FAIL: alte Festnetznummer auf $path gefunden" >&2
              exit 1
            fi
            echo "PASS no obsolete landline: $path"
          done

      - name: Region routes respond 200
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          for path in /regionen/dassow/ /regionen/poetenitz/ /regionen/rosenhagen/ /regionen/travemuende/ /regionen/priwall/; do
            code="$(curl --retry 3 --retry-all-errors -LsS -o /dev/null -w '%{http_code}' "https://immo-hoehn.de$path")"
            echo "$path $code"
            test "$code" = 200
          done

      - name: Robots is production-ready
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors -LsS -o /tmp/robots -w '%{http_code}' https://immo-hoehn.de/robots.txt)"
          test "$code" = 200
          grep -Fq 'Sitemap: https://immo-hoehn.de/sitemap-index.xml' /tmp/robots
          ! grep -Eq '^Disallow:[[:space:]]*/[[:space:]]*$' /tmp/robots

      - name: Sitemap is production-ready
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl --retry 3 --retry-all-errors -LsS -o /tmp/sitemap -w '%{http_code}' https://immo-hoehn.de/sitemap-index.xml)"
          test "$code" = 200
          grep -Fq 'https://immo-hoehn.de/' /tmp/sitemap

      - name: Impressum is final release
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 3 --retry-all-errors -LsS https://immo-hoehn.de/impressum/ -o /tmp/impressum
          grep -Fq 'Christine Bringmann' /tmp/impressum
          grep -Fq 'Amt Schönberger Land' /tmp/impressum
          grep -Fq 'info@immo-hoehn.de' /tmp/impressum
          ! grep -Fq 't-online.de' /tmp/impressum

      - name: Safe legacy redirects work
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          base='https://immo-hoehn.de'
          check_redirect() {
            local path="$1" expected="$2" out code target final
            out="$(curl --retry 3 --retry-all-errors -sS --max-time 25 -o /dev/null -w '%{http_code} %{redirect_url}' "$base$path")"
            code="${out%% *}"
            target="${out#* }"
            echo "$path -> $target [$code]"
            [[ "$code" = 301 || "$code" = 308 ]]
            [[ "$target" = "$base$expected" ]]
            final="$(curl -sS --max-time 25 -L -o /dev/null -w '%{http_code} %{num_redirects} %{url_effective}' "$base$path")"
            [[ "$final" = "200 1 $base$expected" ]]
          }
          check_redirect /verkaufen /immobilie-verkaufen/
          check_redirect /aktuelle-angebote /immobilien/
          check_redirect /datenschutzerklaerung /datenschutz/

      - name: Production contact endpoint
        continue-on-error: true
        shell: bash
        run: bash scripts/post-deploy-contact-smoke.sh
