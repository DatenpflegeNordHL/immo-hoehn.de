name: STRATO WordPress 02 Inventory

on:
  push:
    branches:
      - redesign/coastal-blueprint
    paths:
      - '.github/wordpress02-inventory-trigger'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Configure SSH
        env:
          STRATO_SSH_PRIVATE_KEY_B64: ${{ secrets.STRATO_SSH_PRIVATE_KEY_B64 }}
          STRATO_SSH_KNOWN_HOSTS: ${{ secrets.STRATO_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$STRATO_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$STRATO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Inventory WordPress 02 public content
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
        shell: bash
        run: |
          set -euo pipefail
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes "$STRATO_SSH_USER@$STRATO_SSH_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          ROOT=""
          for candidate in \
            /home/www/STRATO-apps/wordpress_02/app \
            "$HOME/STRATO-apps/wordpress_02/app" \
            "$HOME/wordpress_02/app"; do
            if [ -f "$candidate/wp-load.php" ]; then ROOT="$candidate"; break; fi
          done
          if [ -z "$ROOT" ]; then
            echo 'WP02_ROOT_NOT_FOUND'
            exit 2
          fi
          echo "WP02_ROOT_FOUND=$ROOT"
          export WP02_ROOT="$ROOT"
          cat > /tmp/wp02-public-inventory.php <<'PHP'
          <?php
          $root = getenv('WP02_ROOT');
          define('WP_USE_THEMES', false);
          require $root . '/wp-load.php';
          global $wpdb;
          echo "WP02_SITE=" . home_url('/') . "\n";
          echo "WP02_PUBLIC_CONTENT_BEGIN\n";
          $rows = $wpdb->get_results("SELECT ID,post_type,post_title,post_name,post_date FROM {$wpdb->posts} WHERE post_status='publish' AND post_type <> 'attachment' ORDER BY post_type,post_date DESC,ID DESC");
          foreach ($rows as $row) {
            $title = preg_replace('/[\\r\\n\\t]+/', ' ', wp_strip_all_tags($row->post_title));
            $url = get_permalink($row->ID);
            echo "CONTENT\t{$row->ID}\t{$row->post_type}\t{$row->post_name}\t{$title}\t{$url}\n";
          }
          echo "WP02_PUBLIC_CONTENT_END\n";

          $offers = get_page_by_path('aktuelle-angebote');
          if ($offers) {
            echo "WP02_CURRENT_OFFERS_BEGIN\n";
            echo "OFFERS_PAGE_ID\t{$offers->ID}\n";
            $raw = get_post_meta($offers->ID, '_elementor_data', true);
            if (!$raw) $raw = $offers->post_content;
            $decoded = json_decode($raw, true);
            $attachmentIds = [];
            $seenText = [];
            $walk = function ($value, $key = '') use (&$walk, &$attachmentIds, &$seenText) {
              if (is_array($value)) {
                if (isset($value['id']) && is_numeric($value['id']) && (isset($value['url']) || str_contains(strtolower($key), 'image') || str_contains(strtolower($key), 'gallery'))) {
                  $attachmentIds[] = (int) $value['id'];
                }
                foreach ($value as $k => $v) $walk($v, (string) $k);
                return;
              }
              if (!is_string($value)) return;
              if (preg_match_all('/wp-image-(\\d+)/i', $value, $m)) foreach ($m[1] as $id) $attachmentIds[] = (int) $id;
              if (preg_match_all('/https?:\\/\\/[^"<> ]+\\.(?:jpe?g|png|webp)(?:\\?[^"<> ]*)?/i', $value, $urls)) {
                foreach ($urls[0] as $src) echo "OFFER_MEDIA_URL\t{$key}\t{$src}\n";
              }
              $plain = trim(preg_replace('/\\s+/', ' ', wp_strip_all_tags(html_entity_decode($value, ENT_QUOTES | ENT_HTML5, 'UTF-8'))));
              if ($plain === '' || strlen($plain) < 3 || strlen($plain) > 900) return;
              if (preg_match('/^(#?[0-9a-f]{3,8}|-?\\d+(?:\\.\\d+)?(?:px|em|rem|%|vh|vw)?|https?:\\/\\/[^ ]+)$/i', $plain)) return;
              if (!preg_match('/[A-Za-zÄÖÜäöüß]{3}/u', $plain)) return;
              $fingerprint = md5($plain);
              if (isset($seenText[$fingerprint])) return;
              $seenText[$fingerprint] = true;
              echo "OFFER_TEXT\t{$key}\t{$plain}\n";
            };
            if (is_array($decoded)) $walk($decoded, 'root'); else $walk($raw, 'post_content');
            foreach (array_values(array_unique($attachmentIds)) as $aid) {
              $src = wp_get_attachment_url($aid);
              if (!$src) continue;
              $title = preg_replace('/[\\r\\n\\t]+/', ' ', get_the_title($aid));
              echo "OFFER_MEDIA\t{$aid}\t{$title}\t{$src}\n";
            }
            echo "WP02_CURRENT_OFFERS_END\n";
          }
          PHP
          php /tmp/wp02-public-inventory.php
          echo 'WP02_RELEVANT_UPLOAD_NAMES_BEGIN'
          find "$ROOT/wp-content/uploads" -type f \( -iname '*.jpg' -o -iname '*.jpeg' -o -iname '*.png' -o -iname '*.webp' \) 2>/dev/null \
            | grep -Ei '(immob|objekt|haus|wohnung|grund|poeten|pöten|rosenh|travem|priwall|172[0-9]|17[0-9][0-9])' \
            | sed "s#^$ROOT/wp-content/uploads/##" \
            | head -n 1000 || true
          echo 'WP02_RELEVANT_UPLOAD_NAMES_END'
          rm -f /tmp/wp02-public-inventory.php
          REMOTE
