name: Höhn STRATO Stage Deploy

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Zum Upload in den separaten STRATO-Zielordner exakt DEPLOY-HOEHN-STAGE eingeben'
        required: true
        type: string
  push:
    branches:
      - redesign/coastal-blueprint
    paths:
      - '.github/deploy-stage-trigger'

permissions:
  contents: read

jobs:
  deploy-stage:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Require explicit staging confirmation
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            test "${{ inputs.confirmation }}" = "DEPLOY-HOEHN-STAGE" || {
              echo "Abbruch: falsche Bestätigung." >&2
              exit 1
            }
          elif [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            echo "Deploy wurde kontrolliert über .github/deploy-stage-trigger ausgelöst."
          else
            echo "Abbruch: unerwartetes Event $GITHUB_EVENT_NAME." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Fetch canonical WordPress 02 offer media
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          STRATO_SSH_PRIVATE_KEY_B64: ${{ secrets.STRATO_SSH_PRIVATE_KEY_B64 }}
          STRATO_SSH_KNOWN_HOSTS: ${{ secrets.STRATO_SSH_KNOWN_HOSTS }}
        run: bash scripts/fetch-wp02-media.sh

      - name: Validate contact endpoint syntax
        run: php -l public/api/contact.php

      - name: Verify WordPress 02 property media
        run: node scripts/property-media-preflight.mjs

      - name: Build production-intent site
        env:
          PUBLIC_SITE_NOINDEX: 'false'
        run: npm run build

      - name: Run production readiness gate
        run: node scripts/production-readiness.mjs

      - name: Add clean STRATO htaccess to build
        run: cp deploy/strato-new-site.htaccess dist/.htaccess

      - name: Validate STRATO deployment secrets and target safety
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          STRATO_SSH_PRIVATE_KEY_B64: ${{ secrets.STRATO_SSH_PRIVATE_KEY_B64 }}
          STRATO_SSH_KNOWN_HOSTS: ${{ secrets.STRATO_SSH_KNOWN_HOSTS }}
          STRATO_DEPLOY_DIR: ${{ secrets.STRATO_DEPLOY_DIR }}
        shell: bash
        run: |
          set -euo pipefail
          for name in STRATO_SSH_HOST STRATO_SSH_USER STRATO_SSH_PRIVATE_KEY_B64 STRATO_SSH_KNOWN_HOSTS STRATO_DEPLOY_DIR; do
            test -n "${!name:-}" || {
              echo "Abbruch: GitHub Secret $name fehlt." >&2
              exit 1
            }
          done

          [[ "$STRATO_DEPLOY_DIR" =~ ^[A-Za-z0-9._/-]+$ ]] || {
            echo "Abbruch: STRATO_DEPLOY_DIR enthält unerwartete Zeichen." >&2
            exit 1
          }

          case "$STRATO_DEPLOY_DIR" in
            /|.|./|*/wordpress_01|*/wordpress_02|wordpress_01|wordpress_02)
              echo "Abbruch: unsicheres oder bestehendes WordPress-Zielverzeichnis." >&2
              exit 1
              ;;
          esac

          if [[ "$STRATO_DEPLOY_DIR" == *"wordpress_"* ]]; then
            echo "Abbruch: Deployment in einen WordPress-Pfad ist ausdrücklich gesperrt." >&2
            exit 1
          fi

      - name: Configure SSH
        env:
          STRATO_SSH_PRIVATE_KEY_B64: ${{ secrets.STRATO_SSH_PRIVATE_KEY_B64 }}
          STRATO_SSH_KNOWN_HOSTS: ${{ secrets.STRATO_SSH_KNOWN_HOSTS }}
        shell: bash
        run: |
          set -euo pipefail
          install -d -m 700 ~/.ssh
          printf '%s' "$STRATO_SSH_PRIVATE_KEY_B64" | base64 --decode > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 >/dev/null
          printf '%s\n' "$STRATO_SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Verify STRATO SSH connection
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            output="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=6 "$STRATO_SSH_USER@$STRATO_SSH_HOST" 'printf "STRATO SSH PASS\n"' 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if grep -q 'STRATO SSH PASS' <<<"$output"; then
              exit 0
            fi
            echo "STRATO SSH verify retry $attempt/4 (exit $status)" >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Create isolated target directory
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          STRATO_DEPLOY_DIR: ${{ secrets.STRATO_DEPLOY_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            output="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$STRATO_SSH_USER@$STRATO_SSH_HOST" "mkdir -p -- '$STRATO_DEPLOY_DIR' && printf 'TARGET DIR PASS\\n'" 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if grep -q 'TARGET DIR PASS' <<<"$output"; then
              exit 0
            fi
            echo "STRATO target-dir retry $attempt/4 (exit $status)" >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Upload Höhn release to isolated STRATO directory
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          STRATO_DEPLOY_DIR: ${{ secrets.STRATO_DEPLOY_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4; do
            if rsync \
              --archive \
              --compress \
              --delete \
              --human-readable \
              --itemize-changes \
              --timeout=60 \
              -e 'ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 -o ServerAliveInterval=10 -o ServerAliveCountMax=6' \
              dist/ "$STRATO_SSH_USER@$STRATO_SSH_HOST:$STRATO_DEPLOY_DIR/"; then
              echo 'STRATO RSYNC PASS'
              exit 0
            fi
            echo "STRATO rsync retry $attempt/4" >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Verify uploaded release files and offer media
        env:
          STRATO_SSH_HOST: ${{ secrets.STRATO_SSH_HOST }}
          STRATO_SSH_USER: ${{ secrets.STRATO_SSH_USER }}
          STRATO_DEPLOY_DIR: ${{ secrets.STRATO_DEPLOY_DIR }}
        shell: bash
        run: |
          set -uo pipefail
          remote_check="
            test -f '$STRATO_DEPLOY_DIR/index.html' &&
            test -f '$STRATO_DEPLOY_DIR/api/contact.php' &&
            test -f '$STRATO_DEPLOY_DIR/.htaccess' &&
            test -f '$STRATO_DEPLOY_DIR/sitemap-index.xml' &&
            test -s '$STRATO_DEPLOY_DIR/assets/wp02/rosenhagen-projekt.webp' &&
            test -s '$STRATO_DEPLOY_DIR/assets/wp02/rosenhagen-kataster.png' &&
            test -s '$STRATO_DEPLOY_DIR/assets/wp02/rosenhagen-luftbild.webp' &&
            test -s '$STRATO_DEPLOY_DIR/assets/wp02/strandvilla-visualisierung.webp' &&
            test -s '$STRATO_DEPLOY_DIR/assets/wp02/terrasse-visualisierung.webp' &&
            printf 'STRATO RELEASE FILE CHECK PASS\\n'
          "
          for attempt in 1 2 3 4; do
            output="$(ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=20 "$STRATO_SSH_USER@$STRATO_SSH_HOST" "$remote_check" 2>&1)"
            status=$?
            printf '%s\n' "$output"
            if grep -q 'STRATO RELEASE FILE CHECK PASS' <<<"$output"; then
              exit 0
            fi
            echo "STRATO release verify retry $attempt/4 (exit $status)" >&2
            sleep $((attempt * 3))
          done
          exit 1

      - name: Write deployment summary
        env:
          STRATO_DEPLOY_DIR: ${{ secrets.STRATO_DEPLOY_DIR }}
        shell: bash
        run: |
          {
            echo '## Höhn STRATO Deploy'
            echo
            echo "- Commit: $GITHUB_SHA"
            echo "- Zielordner: \`$STRATO_DEPLOY_DIR\`"
            echo '- Angebotsquelle: STRATO wordpress_02'
            echo '- WordPress-02-Bilder: PASS'
            echo '- Produktionsbuild + Readiness Gate: PASS'
            echo '- Upload: PASS'
            echo '- WordPress-Installationen wurden nicht verändert.'
          } >> "$GITHUB_STEP_SUMMARY"
