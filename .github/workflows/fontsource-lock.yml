name: Fontsource Lock Bootstrap

on:
  push:
    branches:
      - redesign/coastal-blueprint
    paths:
      - package.json

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: redesign/coastal-blueprint

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install pinned self-hosted fonts
        run: npm install --save-exact @fontsource/caveat@5.3.0 @fontsource/cormorant-garamond@5.3.0 @fontsource/dm-sans@5.3.0

      - name: Commit package lock update when needed
        run: |
          if git diff --quiet -- package.json package-lock.json; then
            echo "No lockfile changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json
          git commit -m "build: lock self-hosted Fontsource fonts"
          git push origin HEAD:redesign/coastal-blueprint
