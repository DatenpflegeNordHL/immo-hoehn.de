name: Post-font documentation sync

on:
  push:
    branches:
      - redesign/coastal-blueprint
    paths:
      - .github/workflows/post-font-doc-sync.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: redesign/coastal-blueprint

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Apply documentation sync
        run: node scripts/post-font-doc-sync.mjs

      - name: Commit cleanup
        run: |
          git rm .github/workflows/post-font-doc-sync.yml scripts/post-font-doc-sync.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/data/site.js LEGAL-LAUNCH-GATE-2026-09-09.md LEGACY-URL-REDIRECT-MATRIX-2026-09-09.md P0-BUILD-QA-2026-09-09.md
          git commit -m "docs: close font and legacy-domain launch gates"
          git push origin HEAD:redesign/coastal-blueprint
