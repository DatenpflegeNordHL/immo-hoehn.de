name: Höhn Release Candidate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Use Node 22
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Validate contact endpoint syntax
        run: php -l public/api/contact.php

      - name: Build production-intent site
        env:
          PUBLIC_SITE_NOINDEX: 'false'
        run: npm run build

      - name: Run production readiness gate
        run: node scripts/production-readiness.mjs

      - name: Reject removed legacy contact data
        run: node scripts/legacy-contact-qa.mjs

      - name: Run mathematical duplicate-content QA
        run: node scripts/content-duplication-qa.mjs

      - name: Assemble release candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-candidate/site release-candidate/deploy-notes
          cp -a dist/. release-candidate/site/
          cp deploy/strato-new-site.htaccess release-candidate/site/.htaccess
          cp deploy/strato-new-site.htaccess release-candidate/deploy-notes/strato-new-site.htaccess
          cp deploy/strato-redirects.htaccess release-candidate/deploy-notes/strato-redirects.htaccess
          cp deploy/strato-security-headers.htaccess release-candidate/deploy-notes/strato-security-headers.htaccess
          cp STRATO-GITHUB-DEPLOY-SETUP-2026-09-09.md release-candidate/deploy-notes/
          cp STRATO-LAUNCH-RUNBOOK-2026-09-09.md release-candidate/deploy-notes/
          cp LEGACY-URL-REDIRECT-MATRIX-2026-09-09.md release-candidate/deploy-notes/
          cp LEGAL-LAUNCH-GATE-2026-09-09.md release-candidate/deploy-notes/
          cat > release-candidate/README.txt <<'EOF'
          HÖHN IMMOBILIEN – RELEASE CANDIDATE

          site/ enthält den geprüften Production-Intent-Build inklusive der für den
          isolierten STRATO-Zielordner vorbereiteten .htaccess.

          deploy-notes/ enthält Launch-Unterlagen und Einzelvorlagen.
          Für den aktuellen Deploy-Weg ist STRATO-GITHUB-DEPLOY-SETUP-2026-09-09.md maßgeblich.

          AKTUELLER PRODUKTIONSSTAND:
          - kanonischer Host: https://immo-hoehn.de
          - HTTP sowie www werden per 301 auf HTTPS/non-www geführt
          - HSTS ist nach Live-Verifikation mit max-age=15552000 aktiv
          - CSP bleibt bis zu einem separaten CSP-Pass bewusst aus
          - alte Festnetznummer ist im Production-Build verboten
          - Duplicate-Content-Gate wird vor Freigabe ausgeführt
          - Objekt-Redirects bleiben bis zur aktuellen Objektbestätigung deaktiviert
          - echte Kontaktformular-Zustellung nach jedem relevanten Server-/Mail-Change erneut prüfen
          EOF

      - name: Upload release candidate
        uses: actions/upload-artifact@v7
        with:
          name: hoehn-release-candidate-${{ github.sha }}
          path: release-candidate
          retention-days: 14
          if-no-files-found: error
