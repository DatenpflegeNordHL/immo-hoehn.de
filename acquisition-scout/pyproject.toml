[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "immo-hoehn-acquisition-scout"
version = "0.1.0"
description = "Deterministic delta engine for the Immo Höhn acquisition scout"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
immo-hoehn-scout = "acquisition_scout.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
